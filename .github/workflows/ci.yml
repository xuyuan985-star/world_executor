name: CI（Bug 199：提交自动检查 lint + tests + gate）

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>$null
          pip install pyflakes
      - name: Lint（AST 语法 + import 检查）
        run: python tools/architecture_check.py --json
      - name: Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tools/smoke_orchestrator.py
      - name: Gate
        run: python tools/run_gate.py --skip-smoke
      - name: Compile check
        run: python -m compileall -q config gui ingest runtime security tools
